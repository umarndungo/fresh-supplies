services:
  # PostgreSQL 16. DB name / app role come from DB_NAME / DB_USER / DB_PASS in
  # the private root .env (see .env.example). Fresh volumes auto-provision the
  # role + ownership via ./db/init (POSTGRES_APP_*); existing volumes use
  # `docker compose run --rm db-bootstrap` (or ./db/bootstrap.sh).
  postgres:
    image: postgres:16-alpine
    container_name: freshroute-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${DB_NAME:-freshroute}
      POSTGRES_APP_USER: ${DB_USER:-freshrouteadmin}
      POSTGRES_APP_PASSWORD: ${DB_PASS:-freshroute@2120}
    # No host port published — reachable only from other containers on the
    # compose network (e.g. `docker exec freshroute-postgres psql ...` still
    # works fine, since that runs inside the container's own network
    # namespace). Previously "5432:5432", directly reachable from the
    # internet on the default postgres/postgres superuser password.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI backend. Prod command override below (no --reload — that's a dev-only
  # file-watcher, wasteful and pointless on a deployed box).
  # DATABASE_URL is derived from DB_* by backend/entrypoint.sh (host=postgres);
  # backend/.env (env_file) supplies JWT and other app settings.
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-freshroute}
      DB_USER: ${DB_USER:-freshrouteadmin}
      DB_PASS: ${DB_PASS:-freshroute@2120}
    # No host port published — only reachable from `caddy` (and other
    # containers) on the compose network. Previously "8001:8000", reachable
    # directly from the internet over plain HTTP, bypassing Caddy entirely.
    volumes:
      - ./backend:/app:z
      - ./post_harvest_data_engine:/post_harvest_data_engine:ro,z
      - ./backend/media:/app/media:z
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Next.js frontend. Prod command override below — `next dev` doesn't produce a
  # build at all, so this now builds once on container start, then serves it.
  frontend:
    build:
      context: .
    command: sh -c "npm run build && npm start"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Relative path, not an absolute URL: Caddy now serves the frontend and
      # backend under the same origin (path-routed — see Caddyfile), so the
      # browser's fetches to /api/v1/* are same-origin. No more CORS, and no
      # per-deploy URL to keep in sync here.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Fresh Supplies}
      # Set this in your .env to the real public URL once cloudflared prints
      # it (`docker compose logs cloudflared`) — it's used for absolute link
      # generation, not for API calls.
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
      NEXT_PUBLIC_DEV_AUTH_BYPASS: ${NEXT_PUBLIC_DEV_AUTH_BYPASS:-false}
    # No host port published — only reachable from `caddy`. Previously
    # "3001:3000", reachable directly from the internet over plain HTTP.
    volumes:
      - .:/app:z
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

  # Internal reverse proxy — path-routes a single origin to frontend/backend
  # (see Caddyfile). No host port published and no TLS/ACME config: TLS is
  # terminated by Cloudflare's edge before traffic ever reaches this box, so
  # this only ever needs to speak plain HTTP to `cloudflared` over the
  # compose network.
  caddy:
    image: caddy:2
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:z
    restart: unless-stopped

  # Cloudflare Tunnel — the only thing with a path to the public internet,
  # and even that's an outbound-only connection this container initiates to
  # Cloudflare's edge, so nothing needs to be opened in Oracle Cloud's
  # security list. This is a free "quick tunnel" (no domain or Cloudflare
  # account token needed): it prints a fresh https://<random>.trycloudflare.com
  # URL to its own logs every time it (re)starts —
  # `docker compose logs cloudflared` — since that hostname isn't stable
  # across restarts, update NEXT_PUBLIC_APP_URL (.env) and the mobile app's
  # API_BASE_URL build define when it changes. A paid domain lets this move
  # to a named tunnel with a fixed hostname later; not required to run this.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://caddy:80
    depends_on:
      - caddy
    restart: unless-stopped

  # One-shot: provision role/db/grants/ownership. Runs automatically on every
  # `docker compose up` (idempotent — see db/init/provision.sh), so a fresh
  # or pre-existing volume both end up correctly provisioned with no manual
  # step. Still runnable standalone: `docker compose run --rm db-bootstrap`
  # (or ./db/bootstrap.sh, or `make bootstrap`).
  db-bootstrap:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      DB_NAME: ${DB_NAME:-freshroute}
      DB_USER: ${DB_USER:-freshrouteadmin}
      DB_PASS: ${DB_PASS:-freshroute@2120}
    volumes:
      - ./db/init/provision.sh:/provision.sh:ro,z
    entrypoint: ["/bin/sh", "/provision.sh"]
    restart: "no"

  # One-shot: run Alembic migrations as the app user (`alembic upgrade head`).
  # Runs automatically on every `docker compose up`, after db-bootstrap and
  # before `backend` starts (see backend's depends_on below) — new migration
  # files (e.g. the multi-tenancy / driver-role / OTP-email ones added this
  # sprint) are picked up with zero manual steps on next `docker compose up`.
  # Still runnable standalone: `docker compose run --rm db-migrate` (or
  # `make migrate`).
  db-migrate:
    build: ./backend
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-freshroute}
      DB_USER: ${DB_USER:-freshrouteadmin}
      DB_PASS: ${DB_PASS:-freshroute@2120}
    working_dir: /app
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ./backend:/app:z
    restart: "no"

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next: